name: 'Build: Windows portable'

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode: devel, nightly, testing, stable'
        default: 'devel'
        required: true
      publish:
        description: 'Publish to FTP: on - publish'
        default: 'off'
        required: false
      dockwidgets_v2:
        description: 'Use KDDockWidgets v2: ON/OFF'
        default: 'ON'
        required: false

concurrency:
  group: ${{ github.workflow }} ${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows_portable:
    runs-on: windows-2025
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Configure workflow
      shell: bash
      env:
        TRANSIFEX_API_TOKEN: ${{ secrets.TRANSIFEX_API_TOKEN }}
        OSUOSL_SSH_ENCRYPT_SECRET: ${{ secrets.OSUOSL_SSH_ENCRYPT_SECRET }}
      run: |
        bash ./buildscripts/ci/tools/make_build_mode_env.sh -e ${{ github.event_name }} -m ${{ inputs.build_mode }}
        BUILD_MODE=$(cat ./build.artifacts/env/build_mode.env)

        bash ./buildscripts/ci/tools/make_build_number.sh
        BUILD_NUMBER=$(cat ./build.artifacts/env/build_number.env)

        DO_UPDATE_TS='false'
        if [[ "$BUILD_MODE" == "testing" || "$BUILD_MODE" == "stable" ]]; then
          DO_UPDATE_TS='true'
          if [ -z "$TRANSIFEX_API_TOKEN" ]; then
            echo "::warning::TRANSIFEX_API_TOKEN is empty; updating .ts files disabled"
            DO_UPDATE_TS='false'
          fi
        fi

        DO_PLACEHOLDER_TRANSLATIONS='false'
        if [[ "$BUILD_MODE" == "nightly" || "$BUILD_MODE" == "devel" ]]; then
          DO_PLACEHOLDER_TRANSLATIONS='true'
        fi

        DO_PUBLISH='false'
        if [ "${{ inputs.publish }}" == "on" ]; then
          DO_PUBLISH='true'
          if [ -z "$OSUOSL_SSH_ENCRYPT_SECRET" ]; then
            echo "::warning::OSUOSL_SSH_ENCRYPT_SECRET is empty; not publishing to OSUOSL"
            DO_PUBLISH='false'
          fi
        fi

        UPLOAD_ARTIFACT_NAME="$(tr '":<>|*?/\\’' '_' <<<"MU4_${BUILD_NUMBER}_Win_portable_${GITHUB_REF#refs/heads/}")"

        echo "github.repository: ${{ github.repository }}"
        echo "BUILD_MODE=$BUILD_MODE" | tee -a $GITHUB_ENV
        echo "BUILD_NUMBER=$BUILD_NUMBER" | tee -a $GITHUB_ENV
        echo "DO_UPDATE_TS=$DO_UPDATE_TS" | tee -a $GITHUB_ENV
        echo "DO_PLACEHOLDER_TRANSLATIONS=$DO_PLACEHOLDER_TRANSLATIONS" | tee -a $GITHUB_ENV
        echo "DO_PUBLISH=$DO_PUBLISH" | tee -a $GITHUB_ENV
        echo "UPLOAD_ARTIFACT_NAME=$UPLOAD_ARTIFACT_NAME" | tee -a $GITHUB_ENV

    - parallel:
      - name: Install Qt
        # NOTE: pinned, not the floating @v4 tag -- v4.4.0+ switched an internal step to
        # GitHub's new "$/action" self-repository syntax, which this CI runner doesn't yet
        # support ("Expected format {org}/{repo}[/path]@ref. Actual '$/action'"). v4.3.1 is
        # the last release before that change; bump once runners catch up.
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: 6.10.2
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qt5compat qtnetworkauth qtshadertools qtwebsockets qtmultimedia'
          cache: true
      - name: Setup environment
        run: |
          buildscripts\ci\windows\setup.bat --portable ON

    - parallel:
      - name: Generate _en.ts files
        shell: bash
        env:
          LUPDATE_ARGS: ""
          POSTPROCESS_ARGS: "--warn-only ${{ env.DO_PLACEHOLDER_TRANSLATIONS == 'true' && '--generate-placeholder-translations' || '' }}"
          POSTPROCESS_LAUNCHER: "python3 -X utf8"
        run: |
          bash ./tools/translations/run_lupdate.sh
      - name: Update .ts files (tx pull)
        if: env.DO_UPDATE_TS == 'true'
        uses: cbjeukendrup/cli-action@windows
        with:
          token: ${{ secrets.TRANSIFEX_API_TOKEN }}
          args: "pull -f"

    - name: Register msvc problem matcher
      run: echo "::add-matcher::.github/problem_matchers/msvc.json"

    - name: Build
      # Note: no --crash_log_url, because we don't upload dump symbols for the portable build,
      # so crash reports from it would not be usable anyway.
      shell: cmd
      env:
        DOCKWIDGETS_V2: ${{ inputs.dockwidgets_v2 == 'ON' && 'ON' || 'OFF' }}
      run: |
        buildscripts\ci\windows\build.bat --portable ON -n %BUILD_NUMBER% --dockwidgets_v2 %DOCKWIDGETS_V2%
    - name: Package
      shell: cmd
      env:
        WIN_SIGN_S3_SECRET: ${{ secrets.WIN_SIGN_S3_SECRET }}
        WIN_SIGN_S3_KEY: ${{ secrets.WIN_SIGN_S3_KEY }}
      run: |
        buildscripts\ci\windows\package.bat --portable ON --signsecret "%WIN_SIGN_S3_SECRET%" --signkey "%WIN_SIGN_S3_KEY%"
    - name: Checksum
      run: |
        bash ./buildscripts/ci/tools/checksum.sh
    - name: Publish to OSUOSL
      if: env.DO_PUBLISH == 'true'
      shell: bash
      env:
        OSUOSL_SSH_ENCRYPT_SECRET: ${{ secrets.OSUOSL_SSH_ENCRYPT_SECRET }}
      run: |
        bash ./buildscripts/ci/tools/osuosl/publish.sh -s "${OSUOSL_SSH_ENCRYPT_SECRET}" --os windows -v 4 --arch x86_64
    - name: Upload artifacts on GitHub
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.UPLOAD_ARTIFACT_NAME }}
        path: build.artifacts\
